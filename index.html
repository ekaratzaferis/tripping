<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Triparw</title>
  <meta name="description" content="An all-in-one live trip guide: plan, checklists, live map, tips and a route timeline.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
  <script>
    // Apply a forced light/dark theme before first paint (Settings → Appearance).
    try {
      var t = JSON.parse(localStorage.getItem('triparw:settings') || '{}').theme;
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#0E0F12' : '#FFFFFF'; });
      }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main>
      <section id="view-live" class="view"></section>
      <section id="view-plan" class="view scroll"></section>
      <section id="view-lists" class="view scroll"></section>
      <section id="view-timeline" class="view scroll"></section>
      <section id="view-settings" class="view scroll"></section>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
